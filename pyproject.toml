[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hlt-classification"
version = "0.1.0"
description = "Reproducible HLT-only JetClass classification research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary research code; third-party components retain their own licenses"}
authors = [
  {name = "HLT Classification research project"},
]
dependencies = [
  "awkward>=2",
  "numpy>=1.24",
  "uproot>=5",
]

[project.optional-dependencies]
model = [
  "torch>=2",
  "weaver-core>=0.4",
]
dev = [
  "pytest>=7",
  "torch>=2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
